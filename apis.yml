aid: prenav
name: Prenav
description: 'PRENAV, Inc. is a Belmont, California company that automates the visual
  inspection of large civil and industrial structures using commercially available
  drones, photogrammetry and deep learning. Its PRENAV.XYZ web platform stitches thousands
  of drone photographs into a high-resolution 3D point-cloud digital twin, then runs
  machine-learning models over that twin to detect cracking in concrete, spalling,
  exposed rebar, cracks in steel and rust, resolving features under 0.2mm and tracking
  change over time. A second line, Synthetic Imagery as a Service, procedurally renders
  thousands of annotated photoreal defect images each month to augment a customer''s
  own AI training sets. PRENAV publishes no developer program, no public API, and no
  machine-readable API description; the product is sold as an enterprise service through
  a contact form.'
